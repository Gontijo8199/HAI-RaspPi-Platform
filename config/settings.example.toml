# Copie para config/settings.toml. Todas as chaves são opcionais: sem elas valem
# os padrões indicados. A chave da API fica em config/secrets.toml ([api] key).

[api]
model = "gemma-4-26b-a4b-it"
# Espera máxima (s) por cada trecho da resposta do LLM. Modelos lentos (ex.: gemma-4
# com imagem) podem precisar de 60 ou mais; estourado, a tela mostra o erro.
timeout_s = 30

[stt]
language = "pt"
whisper_model = "small"          # tiny | base | small | medium | large-v3
whisper_device = "cpu"
whisper_compute_type = "int8"
# Carrega o Whisper em segundo plano logo depois que o menu aparece, para não
# travar a interface ao entrar no chat (o carregamento disputa a CPU).
preload = true

[tts]
backend = "piper"             # piper | espeak | pyttsx3
# Vazios: usa $PIPER_BIN / $PIPER_MODEL (definidos no Dockerfile) ou "piper" do PATH.
piper_bin   = "/home/pi/piper/piper/piper"
piper_model = "/home/pi/piper/voices/pt_BR-faber-medium.onnx"
rate = 160
lang = "pt-br"

[display]
fullscreen = true
width = 1024          # tamanho da janela quando fullscreen = false (ou --windowed)
height = 600
# Teclado na tela (Qt Virtual Keyboard, pt-BR): abre ao tocar num campo; o aluno
# pode desligá-lo no menu ⋯ do chat. false: não carrega o teclado e o método de
# entrada é o do sistema (teclado físico com teclas mortas, IBus etc.).
on_screen_keyboard = true
# Com um só módulo ativo, abre-o direto ao iniciar (← Menu ainda leva ao menu).
open_single_module = false

[modules]
# Liga ou desliga módulos do menu, sobrescrevendo o padrão de modules/__init__.py
# (REGISTRY). O módulo de exemplo vem desligado.
# chat = true
# exemplo = true

[camera]
enabled = true
# Índice do V4L2 (0 = /dev/video0) ou caminho. Em muitas webcams /dev/video1 é
# só metadados: ache o nó certo com   python -m vision.camera --list
device = 0
width = 1280
height = 720
max_side = 1024       # lado maior (px) da foto enviada ao LLM (menos banda e menos tokens)
jpeg_quality = 85
warmup_frames = 8     # frames descartados p/ estabilizar exposição e balanço de branco
save_dir = ""         # vazio = não grava fotos em disco (privacidade); preencha só p/ depurar

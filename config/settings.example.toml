[api]
endpoint = ""
key = ""
model = ""
# Espera máxima (s) por cada trecho da resposta do LLM. Modelos lentos (ex.: gemma-4
# com imagem) podem precisar de 60 ou mais; estourado, a tela mostra o erro.
timeout_s = 30

[stt]
model_path = ""
language = "pt"

[vad]
threshold = 0.5
preroll_ms = 500
silence_ms = 700
interim_interval_ms = 1500

[tts]
backend = "piper"             # piper | espeak | pyttsx3
piper_bin   = "/home/pi/piper/piper/piper"
piper_model = "/home/pi/piper/voices/pt_BR-faber-medium.onnx"
rate = 160
lang = "pt-br"

[display]
# fullscreen/width/height valem para a interface gráfica (menu + módulos) e para a
# janela do modo terminal; enabled, font_size e flashcard_width só para o modo terminal.
driver = ""
enabled = true       
fullscreen = true   
width = 1024   
height = 600
font_size = 20
flashcard_width = 340 

[camera]
enabled = true
# A webcam que também serve de microfone. Índice do V4L2 (0 = /dev/video0) ou caminho.
# Em muitas webcams /dev/video1 é só metadados: ache o nó certo com
#   python -m vision.camera --list
device = 4
width = 1280
height = 720
max_side = 1024       # lado maior (px) da foto enviada ao LLM (menos banda e menos tokens)
jpeg_quality = 85
warmup_frames = 8     # frames descartados p/ estabilizar exposição e balanço de branco
photo_ttl_s = 120     # foto pendente expira se a pergunta não vier nesse tempo
save_dir = ""         # vazio = não grava fotos em disco (privacidade); preencha só p/ depurar

[ux]
# Pausa o microfone enquanto o tutor processa e fala a resposta
# (evita captar o próprio tutor ou falas ao acaso durante o turno).
# Desative para permitir interrupção por voz (barge-in) — ou use --allow-barge-in.
mute_while_responding = true

# Tecla que cancela o pedido em andamento (fala do TTS + stream do LLM) e
# descarta gravação no modo PTT. Evite "esc": o display Tk usa Esc para sair
# da tela cheia. Opções: space | esc | enter | tab | backspace | ctrl+c | letra.
cancel_key = "space"

# Tecla que tira uma foto para a próxima pergunta (vazio = só gatilho de voz).
# Não pode repetir a tecla de cancelamento, Enter nem Ctrl+C.
photo_key = "f"
